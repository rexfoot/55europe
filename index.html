<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>راكبين Rakbin — سفر تشاركي بين مدن المغرب</title>
<meta name="description" content="Rakbin: covoiturage entre les villes du Maroc. Paiement cash.">
<style>
:root{--p:#16a34a;--pd:#15803d;--bg:#f8fafc;--tx:#1e293b;--mut:#64748b;--card:#fff;--bd:#e2e8f0;--wa:#25d366}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.7}
.container{max-width:960px;margin:0 auto;padding:0 1.2rem}
header{background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:50}
.hd{display:flex;align-items:center;justify-content:space-between;height:64px;gap:.8rem}
.logo{font-weight:800;font-size:1.4rem;color:var(--pd)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.7rem 1.2rem;border-radius:10px;font-weight:700;cursor:pointer;border:none;font-size:.95rem;text-decoration:none}
.btn-p{background:var(--p);color:#fff}.btn-o{background:#fff;border:1px solid var(--bd);color:var(--tx)}
.btn-wa{background:var(--wa);color:#fff}.btn-sm{padding:.45rem .8rem;font-size:.85rem;border-radius:8px}
.lang{display:flex;gap:.4rem}.lang button{padding:.4rem .8rem;border-radius:8px;border:1px solid var(--bd);background:#fff;cursor:pointer;font-weight:700}
.lang button.on{background:var(--p);color:#fff;border-color:var(--p)}
.hero{background:linear-gradient(135deg,#f0fdf4,#eff6ff);padding:2.5rem 0;text-align:center}
.hero h1{font-size:2rem;margin-bottom:.5rem}.hero p{color:var(--mut);max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:1.3rem;margin-bottom:1.2rem;box-shadow:0 3px 14px rgba(0,0,0,.04)}
.sec{padding:1.5rem 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
label{display:block;font-weight:700;margin-bottom:.3rem;font-size:.9rem}
input{width:100%;padding:.7rem .9rem;border:1px solid var(--bd);border-radius:9px;font-size:1rem;font-family:inherit}
.fg{margin-bottom:.9rem}.trip{border-bottom:1px solid var(--bd);padding:1rem 0}.trip:last-child{border-bottom:none}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem}.muted{color:var(--mut);font-size:.9rem}
.empty{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:1.2rem;text-align:center;color:#92400e}
.tabs{display:flex;gap:.6rem;margin-bottom:1rem}
.tabs button{flex:1;padding:.8rem;border-radius:10px;border:1px solid var(--bd);background:#fff;font-weight:800;cursor:pointer}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
footer{background:#0f172a;color:#94a3b8;text-align:center;padding:2rem 0;margin-top:2rem;font-size:.9rem}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.hero h1{font-size:1.6rem}}
/* logo rojo */
.logo{color:#c1272d !important}
</style>
</head>
<body>
<header><div class="container hd">
<div class="logo">راكبين · Rakbin</div>
<div class="lang"><button id="b-ar" class="on" onclick="setLang('ar')">العربية</button><button id="b-fr" onclick="setLang('fr')">Français</button></div>
</div></header>
<main class="container">
<section class="hero"><h1 data-i="t1">سفر تشاركي بين مدن المغرب</h1><p data-i="t2">السائق ينشر رحلته برقم واتساب الخاص به. الراكب يبحث ويتواصل مباشرة. الدفع نقدا بينهما.</p></section>
<section class="sec">
<div class="tabs"><button id="tab-s" class="on" onclick="tab('s')">🔍 <span data-i="search">بحث</span></button><button id="tab-p" onclick="tab('p')">＋ <span data-i="pub">انشر رحلة</span></button></div>
<div id="v-s">
<div class="card"><div class="grid2">
<div class="fg"><label data-i="from">مدينة الانطلاق</label><input id="q-from" data-ph="fromPh" placeholder="مثال: الدار البيضاء"></div>
<div class="fg"><label data-i="to">مدينة الوصول</label><input id="q-to" data-ph="toPh" placeholder="مثال: مراكش"></div>
</div><div class="fg"><label data-i="date">التاريخ</label><input type="date" id="q-date"></div>
<button class="btn btn-p" onclick="render()" data-i="searchBtn">ابحث</button></div>
<div id="list"></div>
</div>
<div id="v-p" style="display:none"><div class="card"><div class="grid2">
<div class="fg"><label data-i="from">مدينة الانطلاق</label><input id="f-from" data-ph="fromPh" placeholder="مثال: الدار البيضاء"></div>
<div class="fg"><label data-i="to">مدينة الوصول</label><input id="f-to" data-ph="toPh" placeholder="مثال: مراكش"></div></div>
<div class="grid2"><div class="fg"><label data-i="date">التاريخ</label><input type="date" id="f-date"></div>
<div class="fg"><label data-i="time">الساعة</label><input type="time" id="f-time"></div></div>
<div class="grid2"><div class="fg"><label data-i="seats">المقاعد (1–8)</label><input type="number" id="f-seats" min="1" max="8" value="3"></div>
<div class="fg"><label data-i="price">الثمن (درهم MAD)</label><input type="number" id="f-price" min="1" placeholder="100"></div></div>
<div class="fg"><label data-i="wa">واتساب السائق (212xxxxxxxxx)</label><input id="f-wa" placeholder="212600000000" inputmode="numeric"></div>
<p class="muted" data-i="waHelp">يُستعمل فقط ليتواصل معك الركاب. لا يُطلب لا بطاقة هوية ولا صور.</p>
<button class="btn btn-p" onclick="publish()" data-i="pubBtn">نشر الرحلة</button>
<p class="muted" style="margin-top:.6rem" data-i="delHelp">ستحصل على رمز حذف. احتفظ به لمسح إعلانك لاحقا.</p>
</div></div>
</section>
</main>
<footer><div class="container"><p>راكبين Rakbin · Maroc · <span data-i="cash">الدفع نقدا بين السائق والراكب</span></p></div></footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, getDocs, updateDoc, deleteDoc, writeBatch, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Plan Spark (gratis). La seguridad la ponen las reglas de firestore.rules, no esta config.
const firebaseConfig = { apiKey: "AIzaSyDASn4yK7WgytFk_zgGHUAjaVwsWz9HG38", authDomain: "rakbin.firebaseapp.com", projectId: "rakbin", storageBucket: "rakbin.firebasestorage.app", messagingSenderId: "483183046870", appId: "1:483183046870:web:aeb5127558ccfa41a81977" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const TRIPS = collection(db, "trips");

var T={
ar:{t1:"سفر تشاركي بين مدن المغرب",t2:"السائق ينشر رحلته برقم واتساب الخاص به. الراكب يبحث ويتواصل مباشرة. الدفع نقدا بينهما.",search:"بحث",pub:"انشر رحلة",from:"مدينة الانطلاق",to:"مدينة الوصول",date:"التاريخ",time:"الساعة",seats:"المقاعد (1–8)",price:"الثمن (درهم MAD)",wa:"واتساب السائق (212xxxxxxxxx)",waHelp:"يُستعمل فقط ليتواصل معك الركاب. لا يُطلب لا بطاقة هوية ولا صور.",pubBtn:"نشر الرحلة",delHelp:"ستحصل على رمز حذف. احتفظ به لمسح إعلانك لاحقا.",searchBtn:"ابحث",fromPh:"مثال: الدار البيضاء",toPh:"مثال: مراكش",none:"لا توجد رحلات مطابقة حاليا.",contact:"تواصل واتساب",del:"حذف",rep:"تبليغ",askDel:"أدخل رمز الحذف الخاص بهذا الإعلان:",pubOk:"تم نشر رحلتك! رمز الحذف (احفظه):",seatsU:"مقاعد",mad:"درهم",bad:"المرجو ملء كل الحقول بشكل صحيح (مدن، تاريخ مستقبلي، مقاعد 1-8، ثمن > 0، واتساب 212xxxxxxxxx).",repOk:"شكرا، تم تسجيل التبليغ.",delOk:"تم حذف الإعلان.",cash:"الدفع نقدا بين السائق والراكب"},
fr:{t1:"Covoiturage entre les villes du Maroc",t2:"Le conducteur publie avec son WhatsApp. Le passager cherche et contacte directement. Paiement cash.",search:"Rechercher",pub:"Publier",from:"Ville de départ",to:"Ville d'arrivée",date:"Date",time:"Heure",seats:"Places (1–8)",price:"Prix (MAD)",wa:"WhatsApp conducteur (212xxxxxxxxx)",waHelp:"Uniquement pour être contacté. Ni CIN ni photos.",pubBtn:"Publier",delHelp:"Gardez votre code de suppression.",searchBtn:"Rechercher",fromPh:"Ex : Casablanca",toPh:"Ex : Marrakech",none:"Aucun trajet pour le moment.",contact:"Contacter WhatsApp",del:"Supprimer",rep:"Signaler",askDel:"Votre code de suppression :",pubOk:"Publié ! Code de suppression :",seatsU:"places",mad:"MAD",bad:"Champs invalides (villes, date future, places 1-8, prix > 0, WhatsApp 212xxxxxxxxx).",repOk:"Merci, signalement enregistré.",delOk:"Annonce supprimée.",cash:"Paiement cash entre conducteur et passager"}};
var lang="ar", cache=[];
window.setLang=function(l){lang=l;var d=document.documentElement;d.lang=l;d.dir=l==="ar"?"rtl":"ltr";
document.getElementById("b-ar").classList.toggle("on",l==="ar");document.getElementById("b-fr").classList.toggle("on",l==="fr");
document.querySelectorAll("[data-i]").forEach(function(e){var k=e.getAttribute("data-i");if(T[l][k])e.textContent=T[l][k]});
document.querySelectorAll("[data-ph]").forEach(function(e){var k=e.getAttribute("data-ph");if(T[l][k])e.placeholder=T[l][k]});draw();};
window.tab=function(w){document.getElementById("v-s").style.display=w==="s"?"":"none";document.getElementById("v-p").style.display=w==="p"?"":"none";
document.getElementById("tab-s").classList.toggle("on",w==="s");document.getElementById("tab-p").classList.toggle("on",w==="p");};
function today(){return new Date().toISOString().slice(0,10)}
function norm(s){return (s||"").trim().toLowerCase()}
function valid(f){return f.from.length>=2&&f.from.length<=60&&f.to.length>=2&&f.to.length<=60&&/^\d{4}-\d{2}-\d{2}$/.test(f.date)&&f.date>=today()&&/^\d{2}:\d{2}$/.test(f.time)
&&Number.isInteger(f.seats)&&f.seats>=1&&f.seats<=8&&f.price>0&&f.price<=10000&&/^212\d{9}$/.test(f.wa)}
window.publish=async function(){
var f={from:document.getElementById("f-from").value.trim(),to:document.getElementById("f-to").value.trim(),date:document.getElementById("f-date").value,time:document.getElementById("f-time").value,seats:parseInt(document.getElementById("f-seats").value,10),price:parseFloat(document.getElementById("f-price").value),wa:(function(w){w=w.replace(/\D/g,"");if(w.indexOf("00212")===0)w=w.slice(2);if(/^0[5-7]\d{8}$/.test(w))w="212"+w.slice(1);return w})(document.getElementById("f-wa").value),reports:0,createdAt:serverTimestamp()};
if(!valid(f)){alert(T[lang].bad);return}
var code=Math.random().toString(36).slice(2,10);
try{var ref=doc(TRIPS);var b=writeBatch(db);b.set(ref,f);b.set(doc(db,"secrets",ref.id),{code:code});await b.commit();
alert(T[lang].pubOk+" "+code);tab("s");await render();}catch(e){alert("Error: "+e.message)}};
window.render=async function(){
var s=await getDocs(TRIPS);
cache=s.docs.map(function(d){var o=d.data();o._id=d.id;return o});draw();};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function draw(){
var qf=norm(document.getElementById("q-from").value),qt=norm(document.getElementById("q-to").value),qd=document.getElementById("q-date").value;
var t=today();
var r=cache.filter(function(x){return (x.reports||0)<3&&x.date>=t&&(!qf||norm(x.from).indexOf(qf)>-1)&&(!qt||norm(x.to).indexOf(qt)>-1)&&(!qd||x.date===qd)});
r.sort(function(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1});
var box=document.getElementById("list");
if(!r.length){box.innerHTML='<div class="empty">'+T[lang].none+'</div>';return}
box.innerHTML=r.map(function(x){
var msg=encodeURIComponent(lang==="ar"?("السلام، مهتم برحلة "+x.from+" إلى "+x.to+" بتاريخ "+x.date):("Bonjour, intéressé par "+x.from+" → "+x.to+" le "+x.date));
return '<div class="card trip"><strong>'+esc(x.from)+' → '+esc(x.to)+'</strong><br><span class="muted">'+esc(x.date)+' · '+esc(x.time)+' · '+esc(x.seats)+' '+T[lang].seatsU+' · <strong>'+esc(x.price)+' '+T[lang].mad+'</strong></span>'+
'<div class="row"><a class="btn btn-wa btn-sm" target="_blank" rel="noopener" href="https://wa.me/'+esc(x.wa)+'?text='+msg+'">'+T[lang].contact+'</a>'+
'<button class="btn btn-o btn-sm" onclick="delTrip(\''+x._id+'\')">'+T[lang].del+'</button>'+
'<button class="btn btn-o btn-sm" onclick="repTrip(\''+x._id+'\')">⚠ '+T[lang].rep+'</button></div></div>'}).join("");}
window.delTrip=async function(id){
var code=prompt(T[lang].askDel);if(!code)return;
try{await updateDoc(doc(db,"trips",id),{deleteCode:code.trim()});await deleteDoc(doc(db,"trips",id));alert(T[lang].delOk);await render();}
catch(e){alert("Error: "+e.message)}};
window.repTrip=async function(id){
try{var k="rakbin_rep";var seen={};try{seen=JSON.parse(localStorage.getItem(k))||{}}catch(e){seen={}}
if(seen[id]){alert(T[lang].repOk);return}
await updateDoc(doc(db,"trips",id),{reports:increment(1)});seen[id]=1;
try{localStorage.setItem(k,JSON.stringify(seen))}catch(e){}alert(T[lang].repOk);await render();}
catch(e){alert("Error: "+e.message)}};
setLang("ar");render();
</script>
</body>
</html>
